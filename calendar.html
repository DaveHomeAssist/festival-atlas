<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Festival Atlas calendar view for festival dates and route planning.">
<title>Festival Atlas · Calendar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="shared.css">
<style>
.calendar-hero {
  max-width: 1180px;
  margin: 42px auto 20px;
}

.calendar-hero h1 {
  font-family: var(--font-display);
  font-size: clamp(38px, 7vw, 82px);
  line-height: .9;
  letter-spacing: 0;
  margin: 8px 0 14px;
  max-width: 820px;
}

.calendar-hero p {
  color: var(--text-secondary);
  max-width: 660px;
  font-size: 17px;
}

.calendar-shell {
  max-width: 1180px;
  margin: 0 auto 42px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 18px;
  align-items: start;
}

.calendar-board,
.calendar-detail {
  background: rgba(255,250,241,0.88);
  border: 1px solid var(--border-light);
  border-radius: var(--r-md);
  padding: 18px;
}

.calendar-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.month-title {
  font-family: var(--font-display);
  font-size: 34px;
  line-height: 1;
}

.calendar-actions,
.calendar-filters,
.event-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.calendar-controls {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) 170px;
  gap: 10px;
  margin: 0 0 12px;
}

.calendar-input {
  min-width: 0;
  min-height: 42px;
  border: 1px solid var(--border-light);
  border-radius: var(--r-md);
  background: rgba(255,255,255,0.68);
  color: var(--text-primary);
  font-family: var(--font-data);
  font-size: 12px;
  padding: 10px 12px;
}

.calendar-stats {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0 14px;
}

.calendar-stat {
  border: 1px solid var(--border-light);
  border-radius: var(--r-md);
  background: rgba(16,24,38,0.04);
  padding: 10px;
}

.calendar-stat-value {
  font-family: var(--font-display);
  font-size: 26px;
  line-height: 1;
}

.calendar-stat-label {
  color: var(--text-muted);
  font-family: var(--font-data);
  font-size: 9px;
  letter-spacing: .1em;
  margin-top: 5px;
  text-transform: uppercase;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border: 1px solid var(--border-light);
  border-radius: var(--r-md);
  overflow: hidden;
  background: rgba(16,24,38,0.06);
}

.weekday,
.day-cell {
  min-width: 0;
  border-right: 1px solid rgba(16,24,38,0.08);
  border-bottom: 1px solid rgba(16,24,38,0.08);
}

.weekday:nth-child(7n),
.day-cell:nth-child(7n) {
  border-right: 0;
}

.weekday {
  font-family: var(--font-data);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 10px;
  background: rgba(16,24,38,0.05);
}

.day-cell {
  min-height: 132px;
  padding: 8px;
  background: rgba(255,255,255,0.5);
}

.day-cell.is-outside {
  background: rgba(16,24,38,0.035);
  color: var(--text-muted);
}

.day-cell.is-today {
  box-shadow: inset 0 0 0 2px rgba(241,92,65,0.45);
}

.day-number {
  font-family: var(--font-data);
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 7px;
}

.event-chip {
  width: 100%;
  display: block;
  text-align: left;
  border: 1px solid rgba(16,24,38,0.1);
  border-left: 4px solid var(--event-color, var(--red));
  border-radius: var(--r-sm);
  background: rgba(255,250,241,0.9);
  color: var(--text-primary);
  padding: 7px 8px;
  margin-bottom: 6px;
  cursor: pointer;
}

.event-chip:hover,
.event-chip.is-selected {
  border-color: rgba(16,24,38,0.28);
  background: #fffaf1;
}

.event-name {
  display: block;
  font-weight: 700;
  font-size: 12px;
  line-height: 1.2;
}

.event-meta {
  display: block;
  color: var(--text-secondary);
  font-size: 11px;
  margin-top: 2px;
}

.more-count {
  font-family: var(--font-data);
  font-size: 10px;
  color: var(--text-muted);
}

.calendar-detail {
  position: sticky;
  top: 76px;
}

.detail-kicker {
  font-family: var(--font-data);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.detail-title {
  font-family: var(--font-display);
  font-size: 32px;
  line-height: 1;
  margin: 8px 0;
}

.detail-copy {
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 12px;
}

.event-list {
  display: grid;
  gap: 10px;
  margin-top: 14px;
}

.event-list-card {
  border: 1px solid var(--border-light);
  border-radius: var(--r-md);
  background: rgba(255,255,255,0.52);
  padding: 12px;
}

.detail-event-name {
  font-weight: 700;
  color: var(--text-primary);
}

.empty-calendar {
  padding: 18px;
  color: var(--text-secondary);
}

@media (max-width: 980px) {
  .calendar-shell {
    grid-template-columns: 1fr;
  }

  .calendar-detail {
    position: static;
  }
}

@media (max-width: 700px) {
  .calendar-controls,
  .calendar-stats {
    grid-template-columns: 1fr;
  }

  .calendar-grid {
    display: block;
    border: 0;
    background: transparent;
  }

  .weekday {
    display: none;
  }

  .day-cell,
  .day-cell:nth-child(7n) {
    min-height: 0;
    border: 1px solid var(--border-light);
    border-radius: var(--r-md);
    margin-bottom: 8px;
  }

  .day-cell.is-outside {
    display: none;
  }
}
</style>
</head>

<main id="main-content" class="page-wrap">
  <section class="calendar-hero fade-up">
    <div class="section-label">Calendar</div>
    <h1>See the season by date.</h1>
    <p>Browse festival days, route stops, saved targets, and next-confirmed dates in one month view.</p>
  </section>

  <section class="calendar-shell">
    <section class="calendar-board fade-up fade-up-1">
      <div class="calendar-toolbar">
        <div>
          <div class="section-label">Month</div>
          <div class="month-title" id="monthTitle">Calendar</div>
        </div>
        <div class="calendar-actions">
          <button class="btn btn-ghost" id="prevMonth">Previous</button>
          <button class="btn btn-export" id="todayMonth">Today</button>
          <button class="btn btn-ghost" id="nextMonth">Next</button>
        </div>
      </div>
      <div class="calendar-filters" aria-label="Calendar filters">
        <button class="chip is-active" data-filter="all">All</button>
        <button class="chip" data-filter="route">Route</button>
        <button class="chip" data-filter="saved">Saved</button>
        <button class="chip" data-filter="attended">Attended</button>
        <button class="chip" data-filter="next-confirmed">Next confirmed</button>
      </div>
      <div class="calendar-controls">
        <input class="calendar-input" id="calendarSearch" type="search" placeholder="Search festival, city, source note, ops signal">
        <input class="calendar-input" id="monthJump" type="month" aria-label="Jump to month">
      </div>
      <div class="calendar-stats" id="calendarStats" aria-live="polite"></div>
      <div class="calendar-grid" id="calendarGrid" aria-live="polite"></div>
    </section>

    <aside class="calendar-detail fade-up fade-up-2" id="calendarDetail"></aside>
  </section>
</main>

<script src="shared/js/core/config.js"></script>
<script src="config.js"></script>
<script src="shared/js/core/storage.js"></script>
<script src="storage.js"></script>

<script src="utils.js"></script>
<script src="data.js"></script>
<script src="logos.js"></script>
<script src="schedule.js"></script>

<script src="device.js"></script>

<script src="international-research-pack.js"></script>
<script src="app.js"></script>
<script>
(function initCalendarView() {
  const app = window.FA.app;
  const utils = window.FA.utils;
  const gridEl = document.getElementById("calendarGrid");
  const detailEl = document.getElementById("calendarDetail");
  const monthTitle = document.getElementById("monthTitle");
  const searchInput = document.getElementById("calendarSearch");
  const monthJump = document.getElementById("monthJump");
  const statsEl = document.getElementById("calendarStats");
  const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const CALENDAR_STATE_KEY = "festivalAtlasCalendarState";
  const savedState = loadCalendarState();
  let activeFilter = savedState.filter || "all";
  let selectedGameId = "";
  let visibleMonth = parseMonthValue(savedState.month) || getInitialMonth();
  let searchQuery = savedState.query || "";

  searchInput.value = searchQuery;

  function escapeHtml(value) {
    return utils.escapeHtml(value);
  }

  function monthKey(date) {
    return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0");
  }

  function isoDate(date) {
    return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
  }

  function parseIsoDate(value) {
    const parts = String(value || "").split("-").map(Number);
    return new Date(parts[0], parts[1] - 1, parts[2] || 1, 12);
  }

  function parseMonthValue(value) {
    const match = String(value || "").match(/^(\d{4})-(\d{2})$/);
    if (!match) return null;
    const year = Number(match[1]);
    const month = Number(match[2]);
    if (!Number.isFinite(year) || !Number.isFinite(month) || month < 1 || month > 12) return null;
    return new Date(year, month - 1, 1, 12);
  }

  function addMonths(date, delta) {
    return new Date(date.getFullYear(), date.getMonth() + delta, 1, 12);
  }

  function getMonthBounds(date) {
    const start = new Date(date.getFullYear(), date.getMonth(), 1, 12);
    const end = new Date(date.getFullYear(), date.getMonth() + 1, 0, 12);
    const gridStart = new Date(start);
    gridStart.setDate(start.getDate() - start.getDay());
    const gridEnd = new Date(end);
    gridEnd.setDate(end.getDate() + (6 - end.getDay()));
    return { start, end, gridStart, gridEnd };
  }

  function getInitialMonth() {
    const today = new Date();
    const todayIso = isoDate(today);
    const futureEvents = app.getFestivalCalendarEvents({ startDate: todayIso });
    const first = futureEvents[0] || app.getFestivalCalendarEvents({})[0];
    return first ? new Date(parseIsoDate(first.date).getFullYear(), parseIsoDate(first.date).getMonth(), 1, 12) : new Date(today.getFullYear(), today.getMonth(), 1, 12);
  }

  function loadCalendarState() {
    try {
      return JSON.parse(window.localStorage.getItem(CALENDAR_STATE_KEY) || "{}") || {};
    } catch (error) {
      return {};
    }
  }

  function saveCalendarState() {
    try {
      window.localStorage.setItem(CALENDAR_STATE_KEY, JSON.stringify({
        month: monthKey(visibleMonth),
        filter: activeFilter,
        query: searchQuery
      }));
    } catch (error) {}
  }

  function eventSearchText(event) {
    const ops = app.getFestivalOps(event.festivalId) || {};
    return [
      event.festivalName,
      event.city,
      event.label,
      event.calendarLine,
      event.guide && event.guide.dateRangeLabel,
      event.guide && event.guide.dataLabel,
      event.guide && event.guide.sourceNote,
      ops.region,
      ops.venue,
      ops.organizer,
      ops.publicContact,
      ops.headliners,
      ops.productionNotes,
      (ops.opportunitySignals || []).join(" ")
    ].filter(Boolean).join(" ").toLowerCase();
  }

  function filterEventsBySearch(events) {
    const query = searchQuery.trim().toLowerCase();
    if (!query) return events;
    return events.filter((event) => eventSearchText(event).includes(query));
  }

  function getEventsForRange(startDate, endDate) {
    return filterEventsBySearch(app.getFestivalCalendarEvents({
      startDate,
      endDate,
      filter: activeFilter
    }));
  }

  function getVisibleEvents() {
    const bounds = getMonthBounds(visibleMonth);
    return getEventsForRange(isoDate(bounds.gridStart), isoDate(bounds.gridEnd));
  }

  function eventsByDate(events) {
    return events.reduce((map, event) => {
      map[event.date] = map[event.date] || [];
      map[event.date].push(event);
      return map;
    }, {});
  }

  function renderCalendar() {
    const bounds = getMonthBounds(visibleMonth);
    const events = getVisibleEvents();
    const grouped = eventsByDate(events);
    const todayIso = isoDate(new Date());
    monthTitle.textContent = visibleMonth.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    monthJump.value = monthKey(visibleMonth);
    document.querySelectorAll(".calendar-filters [data-filter]").forEach((item) => item.classList.toggle("is-active", item.dataset.filter === activeFilter));

    let html = weekdays.map((day) => `<div class="weekday">${day}</div>`).join("");
    const cursor = new Date(bounds.gridStart);
    while (cursor <= bounds.gridEnd) {
      const dayIso = isoDate(cursor);
      const dayEvents = grouped[dayIso] || [];
      const visibleEvents = dayEvents.slice(0, 3);
      html += `
        <div class="day-cell ${cursor.getMonth() === visibleMonth.getMonth() ? "" : "is-outside"} ${dayIso === todayIso ? "is-today" : ""}">
          <div class="day-number">${cursor.getDate()}</div>
          ${visibleEvents.map((event) => `
            <button class="event-chip ${event.gameId === selectedGameId ? "is-selected" : ""}" style="--event-color:${escapeHtml(event.color)}" data-game-id="${escapeHtml(event.gameId)}">
              <span class="event-name">${escapeHtml(event.festivalName)}</span>
              <span class="event-meta">${escapeHtml(event.label)}</span>
            </button>
          `).join("")}
          ${dayEvents.length > visibleEvents.length ? `<div class="more-count">+${dayEvents.length - visibleEvents.length} more</div>` : ""}
        </div>
      `;
      cursor.setDate(cursor.getDate() + 1);
    }

    gridEl.innerHTML = html || `<div class="empty-calendar">No events in this range.</div>`;
    if (!selectedGameId || !events.some((event) => event.gameId === selectedGameId)) {
      selectedGameId = events[0] ? events[0].gameId : "";
    }
    renderStats(getEventsForRange(isoDate(bounds.start), isoDate(bounds.end)));
    renderDetail(events);
    saveCalendarState();
  }

  function countUnique(events, key) {
    return new Set(events.map((event) => event[key]).filter(Boolean)).size;
  }

  function renderStats(monthEvents) {
    const routeCount = monthEvents.filter((event) => event.onRoute).length;
    const savedCount = monthEvents.filter((event) => event.shortlisted).length;
    const reviewCount = monthEvents.filter((event) => event.guide && (event.guide.dataStatus === "needs-review" || event.guide.dataStatus === "needs-recheck" || event.guide.dateConfidence === "outreach-review")).length;
    const nextCount = monthEvents.filter((event) => event.guide && event.guide.dateConfidence === "next-confirmed").length;
    statsEl.innerHTML = [
      ["Events", monthEvents.length],
      ["Festivals", countUnique(monthEvents, "festivalId")],
      ["Route", routeCount],
      ["Saved", savedCount],
      ["Verify", reviewCount + nextCount]
    ].map(([label, value]) => `
      <div class="calendar-stat">
        <div class="calendar-stat-value">${value}</div>
        <div class="calendar-stat-label">${label}</div>
      </div>
    `).join("");
  }

  function renderDetail(events) {
    const selected = events.find((event) => event.gameId === selectedGameId) || events[0];
    if (!selected) {
      detailEl.innerHTML = `
        <div class="detail-kicker">No events</div>
        <div class="detail-title">No festival days</div>
        <div class="detail-copy">Try another month or filter.</div>
      `;
      return;
    }

    const sameDay = events.filter((event) => event.date === selected.date);
    detailEl.innerHTML = `
      <div class="detail-kicker">${escapeHtml(app.formatDate(selected.date))}</div>
      <div class="detail-title">${escapeHtml(selected.festivalName)}</div>
      <div class="detail-copy">${escapeHtml(selected.label)} · ${escapeHtml(selected.city)} · ${escapeHtml(selected.guide.dataLabel)}</div>
      ${selected.guide.sourceNote ? `<div class="detail-copy">${escapeHtml(selected.guide.sourceNote)}</div>` : ""}
      <div class="event-actions">
        <button class="btn ${selected.onRoute ? "btn-danger-outline" : "btn-primary"}" data-toggle-route="${escapeHtml(selected.festivalId)}">${selected.onRoute ? "Remove route" : "Add route"}</button>
        <button class="btn btn-export" data-calendar="${escapeHtml(selected.gameId)}">Calendar</button>
        <a href="setkeeper.html" class="btn btn-red" data-open-setkeeper="${escapeHtml(selected.gameId)}">Setkeeper</a>
      </div>
      <div class="event-list">
        ${sameDay.map((event) => `
          <button class="event-list-card" data-game-id="${escapeHtml(event.gameId)}" style="text-align:left; cursor:pointer;">
            <div class="detail-event-name">${escapeHtml(event.festivalName)}</div>
            <div class="detail-copy" style="margin:4px 0 0;">${escapeHtml(event.calendarLine)} · ${escapeHtml(event.guide.dateRangeLabel)}</div>
          </button>
        `).join("")}
      </div>
    `;
  }

  gridEl.addEventListener("click", (event) => {
    const chip = event.target.closest("[data-game-id]");
    if (!chip) return;
    selectedGameId = chip.dataset.gameId;
    renderCalendar();
  });

  detailEl.addEventListener("click", (event) => {
    const card = event.target.closest(".event-list-card[data-game-id]");
    if (card) {
      selectedGameId = card.dataset.gameId;
      renderCalendar();
      return;
    }

    const route = event.target.closest("[data-toggle-route]");
    if (route) {
      if (app.getRouteStore().stops.some((stop) => (typeof stop === "string" ? stop : stop.parkId) === route.dataset.toggleRoute)) {
        app.removeRouteStop(route.dataset.toggleRoute);
      } else {
        app.addRouteStop(route.dataset.toggleRoute, selectedGameId);
      }
      renderCalendar();
      return;
    }

    const calendar = event.target.closest("[data-calendar]");
    if (calendar) {
      const game = app.getGameById(calendar.dataset.calendar);
      if (game) app.downloadGameICS(game);
      return;
    }

    const setkeeper = event.target.closest("[data-open-setkeeper]");
    if (!setkeeper) return;
    app.setSetkeeperContext({ gameId: setkeeper.dataset.openSetkeeper });
  });

  document.getElementById("prevMonth").addEventListener("click", () => {
    visibleMonth = addMonths(visibleMonth, -1);
    selectedGameId = "";
    renderCalendar();
  });

  document.getElementById("nextMonth").addEventListener("click", () => {
    visibleMonth = addMonths(visibleMonth, 1);
    selectedGameId = "";
    renderCalendar();
  });

  document.getElementById("todayMonth").addEventListener("click", () => {
    visibleMonth = getInitialMonth();
    selectedGameId = "";
    renderCalendar();
  });

  searchInput.addEventListener("input", () => {
    searchQuery = searchInput.value;
    selectedGameId = "";
    renderCalendar();
  });

  monthJump.addEventListener("change", () => {
    const nextMonth = parseMonthValue(monthJump.value);
    if (!nextMonth) return;
    visibleMonth = nextMonth;
    selectedGameId = "";
    renderCalendar();
  });

  document.querySelector(".calendar-filters").addEventListener("click", (event) => {
    const button = event.target.closest("[data-filter]");
    if (!button) return;
    activeFilter = button.dataset.filter;
    document.querySelectorAll(".calendar-filters [data-filter]").forEach((item) => item.classList.toggle("is-active", item === button));
    selectedGameId = "";
    renderCalendar();
  });

  renderCalendar();
})();
</script>
